<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Gift for Faii² ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Sacramento&family=Poppins:wght@300;400;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #1a0033 0%, #0d001a 100%);
        }

        /* Ambient Background Glows */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 0, 127, 0.15) 0%, transparent 70%);
            top: -10%;
            left: -10%;
            z-index: 0;
            filter: blur(50px);
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.12) 0%, transparent 70%);
            bottom: -20%;
            right: -10%;
            z-index: 0;
            filter: blur(60px);
            pointer-events: none;
        }

        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            pointer-events: none;
            transform: scale(0.92) translateY(10px);
            z-index: 1;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1) translateY(0);
        }

        /* Redesigned Beautiful Script Headings */
        .aesthetic-title {
            font-family: 'Sacramento', cursive;
            font-size: 4.5rem;
            color: #ff477e;
            font-weight: bold;
            margin-bottom: 40px;
            text-shadow: 0 2px 15px rgba(255, 71, 126, 0.4);
            line-height: 1.2;
        }

        /* Liquid Glass Buttons */
        .btn-container {
            display: flex;
            gap: 40px;
        }

        .btn {
            position: relative;
            padding: 22px 65px;
            font-size: 1.3rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            cursor: pointer;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.03) 100%);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: inset 0 2px 2px rgba(255,255,255,0.2), 0 15px 35px rgba(0, 0, 0, 0.3);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 1px;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 100%;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: -1;
            border-radius: 12px;
        }

        .btn-yes::after {
            background: linear-gradient(0deg, #ff007f, #ff55a3);
        }

        .btn-no::after {
            background: linear-gradient(0deg, #3a3f58, #5c648a);
        }

        .btn:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.4), 0 20px 40px rgba(255, 0, 127, 0.25);
        }

        .btn:hover::after {
            top: 0;
        }

        /* UI 2: Sad Screen */
        #screen-sad {
            background: #08080c;
        }
        #screen-sad h1 {
            color: #3a3b45;
            font-size: 3.5rem;
            font-family: 'Cinzel', serif;
            text-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* UI 3: Beautiful Aesthetic Screen */
        #screen-yes {
            background: radial-gradient(circle at center, #2d0b3d 0%, #0f0314 100%);
        }

        /* Realistic Present Box Design */
        .gift-container {
            margin-top: 50px;
            opacity: 0;
            transform: scale(0.6) translateY(50px);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }

        .gift-container.show {
            opacity: 1;
            transform: scale(1) translateY(0);
            animation: gentleFloat 3s ease-in-out infinite alternate;
        }

        .gift-box {
            position: relative;
            width: 190px;
            height: 170px;
            background: linear-gradient(135deg, #e6005c 0%, #99003d 100%);
            border-radius: 8px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), inset 0 -10px 20px rgba(0,0,0,0.3);
        }

        .gift-lid {
            position: absolute;
            width: 206px;
            height: 40px;
            background: linear-gradient(135deg, #ff1a8c 0%, #cc0066 100%);
            top: -35px;
            left: -8px;
            border-radius: 6px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.4), inset 0 2px 2px rgba(255,255,255,0.3);
            z-index: 2;
        }

        .ribbon-v, .ribbon-h {
            position: absolute;
            background: linear-gradient(to right, #fff176, #ffd54f, #ffca28);
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
        }
        .ribbon-v {
            width: 34px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }
        .ribbon-h {
            width: 100%;
            height: 30px;
            top: 50%;
            transform: translateY(-50%);
        }
        .gift-lid .ribbon-v { height: 40px; }

        .gift-bow-luxury {
            position: absolute;
            top: -65px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 40px;
            z-index: 3;
        }
        .bow-loop {
            position: absolute;
            width: 50px;
            height: 40px;
            border: 12px solid #ffd54f;
            border-radius: 50% 50% 0 50%;
            transform: rotate(-15deg);
            left: -10px;
            box-shadow: -5px 5px 10px rgba(0,0,0,0.3);
        }
        .bow-loop.right {
            border-radius: 50% 50% 50% 0;
            transform: rotate(15deg);
            left: auto;
            right: -10px;
            box-shadow: 5px 5px 10px rgba(0,0,0,0.3);
        }

        @keyframes gentleFloat {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(2deg); }
        }

        /* UI 4: Letter Presentation Screen */
        #screen-letter {
            background: radial-gradient(circle at center, #201435 0%, #0a0512 100%);
            justify-content: center;
            align-items: center;
        }

        .envelope-center-container {
            position: relative;
            width: 420px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .envelope-wrapper {
            position: absolute;
            width: 420px;
            height: 280px;
            background: #5c0622;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.7);
            z-index: 3;
            transition: transform 0.5s ease;
        }

        .envelope-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 210px solid transparent;
            border-right: 210px solid transparent;
            border-top: 170px solid #420216;
            transform-origin: top;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
        }

        .envelope-wrapper.open::before {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope-front {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 210px solid #730a2d;
            border-right: 210px solid #730a2d;
            border-bottom: 150px solid #52041d;
            bottom: 0;
            left: 0;
            z-index: 5;
            border-radius: 0 0 12px 12px;
        }

        .wax-seal {
            position: absolute;
            top: 125px;
            left: 50%;
            transform: translateX(-50%);
            width: 55px;
            height: 55px;
            background: radial-gradient(circle, #e6b800 0%, #997a00 100%);
            border-radius: 50%;
            z-index: 6;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            transition: opacity 0.5s ease;
        }
        
        .envelope-wrapper.open .wax-seal {
            opacity: 0;
            pointer-events: none;
        }

        /* Vintage Paper Note Card */
        .note-card {
            position: absolute;
            width: 380px;
            height: 240px;
            left: 20px;
            bottom: 10px;
            background: #f4ecd8 linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 100% 24px;
            border: 1px solid #dcd1b4;
            border-radius: 4px;
            padding: 40px;
            z-index: 2;
            opacity: 0;
            transform: translateY(0) scale(0.95);
            transition: transform 2.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.5s ease, width 1.5s ease, height 1.5s ease;
            color: #2b1d0c; 
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(139,94,26,0.15), 0 0 15px rgba(0,0,0,0.2);
        }

        /* Presentation Reveal Sequence */
        .envelope-wrapper.open .note-card.slide-out {
            position: fixed;
            left: 50%;
            top: 50%;
            bottom: auto;
            transform: translate(-50%, -50%) scale(1);
            width: 90%;
            max-width: 750px;
            height: 85vh;
            z-index: 10;
            opacity: 1;
            overflow-y: auto;
            border: 12px double #dfd3b3;
            padding: 50px;
            scroll-behavior: smooth;
        }

        .note-text {
            font-size: 1.15rem;
            line-height: 1.9;
            white-space: pre-line;
            font-family: 'Poppins', sans-serif;
            text-shadow: 0 1px 0px rgba(255,255,255,0.5);
        }

        .revealed-line {
            opacity: 0;
            transform: translateY(10px);
            animation: textFadeIn 0.8s ease forwards;
            margin-bottom: 12px;
        }

        @keyframes textFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .note-text h2 {
            font-family: 'Sacramento', cursive;
            font-size: 3.5rem;
            color: #ff477e;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 0 2px 5px rgba(255, 0, 127, 0.2);
            opacity: 0;
            animation: textFadeIn 1s ease forwards 1.8s;
        }

        /* Sparkles */
        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ffd700;
            border-radius: 50%;
            animation: fall 4s linear infinite;
            top: -10px;
            z-index: 100;
        }

        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" src="song1.mp3" loop></audio>

    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <div id="screen-start" class="screen active">
        <h1 class="aesthetic-title">Hi faiii² ready to view my gift?😁</h1>
        <div class="btn-container">
            <button class="btn btn-yes" onclick="chooseYes()">Yes</button>
            <button class="btn btn-no" onclick="chooseNo()">No</button>
        </div>
    </div>

    <div id="screen-sad" class="screen">
        <h1>ayyyy okiee😞</h1>
    </div>

    <div id="screen-yes" class="screen">
        <h1 class="aesthetic-title">awhh okieee as you wish HEHE</h1>
        <div class="gift-container" id="giftBox" onclick="openGift()">
            <div class="gift-bow-luxury">
                <div class="bow-loop"></div>
                <div class="bow-loop right"></div>
            </div>
            <div class="gift-box">
                <div class="gift-lid">
                    <div class="ribbon-v"></div>
                </div>
                <div class="ribbon-v"></div>
                <div class="ribbon-h"></div>
            </div>
        </div>
    </div>

    <div id="screen-letter" class="screen">
        <div class="envelope-center-container">
            <div class="envelope-wrapper" id="envelope">
                <div class="wax-seal">📜</div>
                <div class="envelope-front"></div>
                <div class="note-card" id="noteCard">
                    <div class="note-text" id="noteTextContent">
                        <h2>Happy Birthday Faii!</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const originalMessageText = `Happy happyyyy birthday to my beautiful best friend faii²!! 🥳🎉🎊🤗

I hope that this day will be full of happiness, love, and lots of beautiful memories for yahh. But not just today ha, I hope every single day of your life will be filled with happiness and blessings because you truly deserve all the good things in life.

Always keep your self away from danger, take care of your self, and may God continue to bless yahh, guide yahh, and make your new life in the other state full of wonderful opportunities. And if may mang aaway sayu, just ignore them, kulang lang talaga yan sila sa pansin HAHAHAHAHA.

Thank you so much because naging friend kita. I know this message isn't that long because I really can't express all my feelings or gratitude through words, but I'm truly thankful that I met someone like you.

I hope you won't ever forget me no matter where life takes you, because I'll always treasure our friendship.

Again, happy happyyyy birthday to yahhh!! 🥳🎂 Enjoy your special day, keep smiling, stay safe always, and I wish yahh nothing but happiness, good health, success, and endless blessings.

❤️ I love you always my cutie friend faii² 🤗🤗🤗`;

        function switchScreen(fromId, toId) {
            document.getElementById(fromId).classList.remove('active');
            document.getElementById(toId).classList.add('active');
        }

        function chooseNo() {
            switchScreen('screen-start', 'screen-sad');
        }

        function chooseYes() {
            switchScreen('screen-start', 'screen-yes');
            setTimeout(() => {
                document.getElementById('giftBox').classList.add('show');
            }, 5000);
        }

        function openGift() {
            switchScreen('screen-yes', 'screen-letter');
            
            // Play background music right as the transition begins
            const music = document.getElementById('bgMusic');
            music.play().catch(error => {
                console.log("Audio presentation play block intercepted: ", error);
            });
            
            const envelope = document.getElementById('envelope');
            const noteCard = document.getElementById('noteCard');

            setTimeout(() => {
                envelope.classList.add('open'); 
                
                setTimeout(() => {
                    noteCard.classList.add('slide-out');
                    startConfetti();
                    setTimeout(animateTextAndScroll, 2000);
                }, 1200);

            }, 3000);
        }

        function animateTextAndScroll() {
            const container = document.getElementById('noteTextContent');
            const paragraphs = originalMessageText.split('\n\n');
            let delay = 0;

            paragraphs.forEach((text) => {
                const paraElement = document.createElement('div');
                paraElement.classList.add('revealed-line');
                paraElement.innerText = text;
                paraElement.style.animationDelay = `${delay}s`;
                container.appendChild(paraElement);
                
                delay += 3.5; 
            });

            const scrollTarget = document.getElementById('noteCard');
            
            // Initiate natural auto-scroll sync
            setTimeout(() => {
                const scrollInterval = setInterval(() => {
                    const hasReachedBottom = scrollTarget.scrollTop >= (scrollTarget.scrollHeight - scrollTarget.clientHeight - 2);
                    
                    if (hasReachedBottom) {
                        // Kill the auto-scroll loop immediately when the user reaches the end of the text
                        clearInterval(scrollInterval);
                    } else {
                        scrollTarget.scrollTop += 1; 
                    }
                }, 40); 
            }, 3000);
        }

        function startConfetti() {
            const colors = ['#ff007f', '#ffd700', '#00c8ff', '#ffffff', '#b380ff'];
            for (let i = 0; i < 120; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 3) + 's';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(confetti);
            }
        }
    </script>
</body>
</html>
